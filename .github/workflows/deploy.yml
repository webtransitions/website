# Builds the Eleventy site and deploys it to GitHub Pages.
#
# The repo is mirrored from Tangled to GitHub by .tangled/workflows/mirror.yml;
# this workflow runs on the GitHub copy after the mirror push lands.
#
# One-time setup on GitHub (repo Settings):
#   - Pages -> Build and deployment -> Source: "GitHub Actions"
#   - Pages -> Custom domain: webtransitions.org (already configured if the
#     site was previously served from a branch; keep it)
#   - Secrets and variables -> Actions -> secret ATPROTO_DID (optional, enables
#     the standard.site verification routes in the build)

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          ATPROTO_DID: ${{ secrets.ATPROTO_DID }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
